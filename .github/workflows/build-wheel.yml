name: build-wheel

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  release:
    types: [published]

jobs:
  build:
    name: Build wheel (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # conda-forge's pythonocc-core-feedstock builds for these Python versions,
        # across its standard 3-platform matrix.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up conda-forge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict

      - name: Install pythonocc-core from conda-forge
        shell: bash -l {0}
        run: conda install -y -c conda-forge pythonocc-core=7.9.3

      - name: Strip debug symbols from bundled OCCT dylibs (macOS)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          # delocate-wheel (unlike auditwheel's --strip) has no built-in
          # stripping, and it copies these dylibs from $CONDA_PREFIX/lib
          # into the wheel as-is -- stripping them here, before that copy,
          # is the only way to shrink them.
          find "$CONDA_PREFIX/lib" -name "*.dylib" -exec strip -S -x {} \; 2>/dev/null || true

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge patchelf
          pip install build wheel auditwheel

      - name: Install packaging tools (macOS)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          pip install build wheel delocate
          # conda-forge's `cctools` ships a real `otool`/`install_name_tool`.
          # GitHub's macos-latest `/usr/bin/otool` is a shim that shells out to
          # `xcodebuild -find otool`, which gets SIGKILL'd and crashes delocate
          # with "Unexpected first line: ... Killed: 9 ... xcodebuild". A real
          # otool on PATH (the delocate step runs bash -l so $CONDA_PREFIX/bin
          # is already first) bypasses that entirely.
          conda install -y -c conda-forge cctools

      - name: Install packaging tools (Windows)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: pip install build wheel delvewheel

      - name: Stage OCC.Core package (drop Display/Extend to avoid VTK/Qt weight)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          # site.getsitepackages()[0] is unreliable across platforms -- on this
          # Windows conda env it returned the env root itself, not
          # <env>/Lib/site-packages, so OCC was never found there. Importing OCC
          # directly and asking where it actually lives sidesteps that entirely.
          OCC_DIR=$(python -c "import OCC, os; print(os.path.dirname(OCC.__file__))")
          echo "OCC package directory: $OCC_DIR"
          test -d "$OCC_DIR" || { echo "OCC package not found"; exit 1; }
          mkdir -p staging
          cp -r "$OCC_DIR" staging/OCC
          rm -rf staging/OCC/Display staging/OCC/Extend staging/OCC/Utils
          if [ "$RUNNER_OS" = "macOS" ]; then
            # Same rationale as the CONDA_PREFIX/lib dylib strip above: these
            # extension modules carry debug symbols delocate can't strip itself.
            find staging/OCC -name "*.so" -exec strip -S -x {} \; 2>/dev/null || true
          fi
          find staging/OCC -maxdepth 1

      - name: Restrict OCC.Core to the modules topologicpy needs
        shell: bash -l {0}
        run: |
          set -euo pipefail
          # Full pythonocc-core ships ~312 OCC.Core SWIG modules; topologicpy's
          # pythonocc backend only imports ~28 of them (transitive closure ~78).
          # The STEP/IGES/DXF/Graphic3d/AIS/etc. modules that are NOT needed
          # account for ~231 MiB of binary -- dropping them makes the wheel tiny
          # (~30 MiB) and keeps it under PyPI's 100 MB/file limit with standard
          # DEFLATE compression (PyPI rejects LZMA wheels, so we cannot shrink
          # via recompression). Verified: the restricted wheel passes the full
          # topologicpy pythonocc_backend test suite.
          python tools/restrict_occ.py staging/OCC \
            Bnd BOPAlgo BRep BRepAlgoAPI BRepBndLib BRepBuilderAPI BRepCheck \
            BRepClass3d BRepExtrema BRepGProp BRepLib BRepMesh BRepPrimAPI \
            BRepTools BRepTopAdaptor GeomAbs GeomAPI GeomLProp gp GProp \
            ShapeFix ShapeUpgrade TColgp TopAbs TopExp TopLoc TopoDS TopTools \
            Exception

      - name: Write packaging metadata
        shell: bash -l {0}
        working-directory: staging
        run: |
          cat > pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=61"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "pythonocc-core-wheels"
          version = "7.9.3"
          description = "Unofficial repackaging of the pythonocc-core conda-forge binary (OCC.Core only) as a pip-installable wheel"
          readme = "README.md"
          license = { text = "LGPL-2.1-only" }
          dependencies = ["numpy"]

          [tool.setuptools.packages.find]
          include = ["OCC*"]

          [tool.setuptools.package-data]
          # .so on Linux/macOS, .pyd/.dll on Windows.
          "*" = ["*.so", "*.pyi", "*.pyd", "*.dll"]
          EOF
          cat > setup.py <<'EOF'
          # The package contains prebuilt native extensions (compiled against a
          # specific CPython ABI) copied straight from conda-forge's binary, but
          # setuptools has no ext_modules of its own to detect that, so without
          # this it tags the wheel "py3-none-any" -- claiming universal Python 3
          # compatibility it doesn't actually have. Force has_ext_modules() so
          # `build`/`wheel` produce a correct cpXY-cpXY-<platform> tag instead.
          from setuptools import setup
          from setuptools.dist import Distribution

          class BinaryDistribution(Distribution):
              def has_ext_modules(self):
                  return True

          setup(distclass=BinaryDistribution)
          EOF
          cp ../README.md README.md

      - name: Build wheel
        shell: bash -l {0}
        working-directory: staging
        run: python -m build --wheel --outdir ../dist

      - name: List built wheel (pre-repair)
        shell: bash -l {0}
        run: ls -la dist/

      - name: Repair wheel (Linux, auditwheel)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          echo "--- auditwheel show (before repair) ---"
          auditwheel show dist/*.whl || true
          echo "--- auditwheel repair ---"
          # Don't pin an older manylinux tag: the runner's glibc/libstdc++ versions
          # dictate the minimum compatible tag (verified empirically to be
          # manylinux_2_39 on ubuntu-latest). Let auditwheel pick the correct tag
          # itself rather than guessing and failing.
          # --strip: PyPI caps new projects at 100 MB/file; stripping debug
          # symbols from the bundled OCCT shared libraries is needed to fit.
          # --strip alone still landed at ~110 MB (over) in testing, so also
          # max out zip compression to close the remaining gap.
          auditwheel repair --strip --zip-compression-level 9 dist/*.whl -w wheelhouse/

      - name: Repair wheel (macOS, delocate)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          export DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib:${DYLD_LIBRARY_PATH:-}"
          # Use the real otool from conda's cctools; the /usr/bin/otool shim
          # resolves via `xcodebuild -find otool`, which GitHub's runner
          # SIGKILLs, breaking delocate (see "Install packaging tools (macOS)").
          export PATH="$CONDA_PREFIX/bin:$PATH"
          echo "--- delocate-listdeps (before repair) ---"
          delocate-listdeps dist/*.whl || true
          echo "--- delocate-wheel ---"
          delocate-wheel -v -w wheelhouse/ dist/*.whl

      - name: Repair wheel (Windows, delvewheel)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          echo "--- delvewheel repair ---"
          # conda-forge's Windows packages put shared DLLs under Library/bin,
          # not directly on PATH/site-packages, so point delvewheel there.
          python -m delvewheel repair -w wheelhouse/ --add-path "$CONDA_PREFIX/Library/bin" dist/*.whl

      - name: List repaired wheel
        shell: bash -l {0}
        run: ls -la wheelhouse/

      - name: Check wheel size against PyPI's 100 MB/file limit
        shell: bash -l {0}
        run: |
          set -euo pipefail
          for f in wheelhouse/*.whl; do
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $size bytes"
            if [ "$size" -gt 104857600 ]; then
              echo "::error::$f is $size bytes, over PyPI's 100 MB/file limit for this project. Publish would fail at upload time."
              exit 1
            fi
          done

      - name: Set up plain Python ${{ matrix.python-version }} for the smoke test
        id: smoketest_python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke-test import in a clean env (no conda on PATH)
        shell: bash {0}
        run: |
          set -euo pipefail
          "${{ steps.smoketest_python.outputs.python-path }}" -m venv smoketest_venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_PY="smoketest_venv/Scripts/python.exe"
            VENV_PIP="smoketest_venv/Scripts/pip.exe"
          else
            VENV_PY="smoketest_venv/bin/python3"
            VENV_PIP="smoketest_venv/bin/pip"
          fi
          "$VENV_PIP" install wheelhouse/*.whl
          "$VENV_PY" -c "
          from OCC.Core.gp import gp_Pnt
          from OCC.Core.BRepPrimAPI import BRepPrimAPI_MakeBox
          box = BRepPrimAPI_MakeBox(1.0, 1.0, 1.0).Shape()
          print('OCC.Core import + basic BRep call succeeded:', box)
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: pythonocc-core-wheels-${{ runner.os }}-py${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    # Only ever publish on an explicit GitHub Release -- never on a plain
    # push or PR, even though those trigger the build/test matrix above.
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pythonocc-core-wheels
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) -- no token/secret needed.
      id-token: write
    steps:
      - name: Download all wheel artifacts from the build matrix
        uses: actions/download-artifact@v7
        with:
          path: all-wheels
          pattern: pythonocc-core-wheels-*
          merge-multiple: true

      - name: List collected wheels
        run: ls -la all-wheels/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: all-wheels/
