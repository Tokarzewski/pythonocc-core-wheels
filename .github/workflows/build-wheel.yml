name: build-wheel

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build wheel (Python ${{ matrix.python-version }} on ${{ runner.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # conda-forge's pythonocc-core-feedstock builds for these Python versions,
        # across its standard 3-platform matrix.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up conda-forge environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          channels: conda-forge
          channel-priority: strict

      - name: Install pythonocc-core from conda-forge
        shell: bash -l {0}
        run: conda install -y -c conda-forge pythonocc-core=7.9.3

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge patchelf
          pip install build wheel auditwheel

      - name: Install packaging tools (macOS)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: pip install build wheel delocate

      - name: Install packaging tools (Windows)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: pip install build wheel delvewheel

      - name: Stage OCC.Core package (drop Display/Extend to avoid VTK/Qt weight)
        shell: bash -l {0}
        run: |
          set -euo pipefail
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          echo "site-packages: $SITE_PACKAGES"
          test -d "$SITE_PACKAGES/OCC" || { echo "OCC package not found"; exit 1; }
          mkdir -p staging
          cp -r "$SITE_PACKAGES/OCC" staging/OCC
          rm -rf staging/OCC/Display staging/OCC/Extend staging/OCC/Utils
          find staging/OCC -maxdepth 1

      - name: Write packaging metadata
        shell: bash -l {0}
        working-directory: staging
        run: |
          cat > pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=61"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "pythonocc-core-wheels"
          version = "7.9.3"
          description = "Unofficial repackaging of the pythonocc-core conda-forge binary (OCC.Core only) as a pip-installable wheel"
          readme = "README.md"
          license = { text = "LGPL-2.1-only" }
          dependencies = ["numpy"]

          [tool.setuptools.packages.find]
          include = ["OCC*"]

          [tool.setuptools.package-data]
          # .so on Linux/macOS, .pyd/.dll on Windows.
          "*" = ["*.so", "*.pyi", "*.pyd", "*.dll"]
          EOF
          cat > setup.py <<'EOF'
          # The package contains prebuilt native extensions (compiled against a
          # specific CPython ABI) copied straight from conda-forge's binary, but
          # setuptools has no ext_modules of its own to detect that, so without
          # this it tags the wheel "py3-none-any" -- claiming universal Python 3
          # compatibility it doesn't actually have. Force has_ext_modules() so
          # `build`/`wheel` produce a correct cpXY-cpXY-<platform> tag instead.
          from setuptools import setup
          from setuptools.dist import Distribution

          class BinaryDistribution(Distribution):
              def has_ext_modules(self):
                  return True

          setup(distclass=BinaryDistribution)
          EOF
          cp ../README.md README.md

      - name: Build wheel
        shell: bash -l {0}
        working-directory: staging
        run: python -m build --wheel --outdir ../dist

      - name: List built wheel (pre-repair)
        shell: bash -l {0}
        run: ls -la dist/

      - name: Repair wheel (Linux, auditwheel)
        if: runner.os == 'Linux'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
          echo "--- auditwheel show (before repair) ---"
          auditwheel show dist/*.whl || true
          echo "--- auditwheel repair ---"
          # Don't pin an older manylinux tag: the runner's glibc/libstdc++ versions
          # dictate the minimum compatible tag (verified empirically to be
          # manylinux_2_39 on ubuntu-latest). Let auditwheel pick the correct tag
          # itself rather than guessing and failing.
          auditwheel repair dist/*.whl -w wheelhouse/

      - name: Repair wheel (macOS, delocate)
        if: runner.os == 'macOS'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          export DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib:${DYLD_LIBRARY_PATH:-}"
          echo "--- delocate-listdeps (before repair) ---"
          delocate-listdeps dist/*.whl || true
          echo "--- delocate-wheel ---"
          delocate-wheel -v -w wheelhouse/ dist/*.whl

      - name: Repair wheel (Windows, delvewheel)
        if: runner.os == 'Windows'
        shell: bash -l {0}
        run: |
          set -euo pipefail
          mkdir -p wheelhouse
          echo "--- delvewheel repair ---"
          # conda-forge's Windows packages put shared DLLs under Library/bin,
          # not directly on PATH/site-packages, so point delvewheel there.
          python -m delvewheel repair -w wheelhouse/ --add-path "$CONDA_PREFIX/Library/bin" dist/*.whl

      - name: List repaired wheel
        shell: bash -l {0}
        run: ls -la wheelhouse/

      - name: Set up plain Python ${{ matrix.python-version }} for the smoke test
        id: smoketest_python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Smoke-test import in a clean env (no conda on PATH)
        shell: bash {0}
        run: |
          set -euo pipefail
          "${{ steps.smoketest_python.outputs.python-path }}" -m venv smoketest_venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_PY="smoketest_venv/Scripts/python.exe"
            VENV_PIP="smoketest_venv/Scripts/pip.exe"
          else
            VENV_PY="smoketest_venv/bin/python3"
            VENV_PIP="smoketest_venv/bin/pip"
          fi
          "$VENV_PIP" install wheelhouse/*.whl
          "$VENV_PY" -c "
          from OCC.Core.gp import gp_Pnt
          from OCC.Core.BRepPrimAPI import BRepPrimAPI_MakeBox
          box = BRepPrimAPI_MakeBox(1.0, 1.0, 1.0).Shape()
          print('OCC.Core import + basic BRep call succeeded:', box)
          "

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: pythonocc-core-wheels-${{ runner.os }}-py${{ matrix.python-version }}
          path: wheelhouse/*.whl
          if-no-files-found: error
